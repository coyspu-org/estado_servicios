name: Response Time CI
on:
  schedule:
    - cron: "0 23 * * *"
  repository_dispatch:
    types: [response_time]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: upptime-Record response time
  cancel-in-progress: false
jobs:
  release:
    name: Record response time
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Run Upptime
        uses: upptime/uptime-monitor@v1.44.1
        with:
          command: "response-time"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
