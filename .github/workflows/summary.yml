name: Summary CI
on:
  schedule:
    - cron: "0 1 * * *"
  repository_dispatch:
    types: [summary]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: upptime-Update README
  cancel-in-progress: false
jobs:
  release:
    name: Update README
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Run Upptime
        uses: upptime/uptime-monitor@v1.44.1
        with:
          command: "readme"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
